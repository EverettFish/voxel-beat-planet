<!doctype html>
<html lang="zh-CN"><!-- set lang + UI copy language to match the song's audience -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2a1612">
  <title>Voxel Beat Planet</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene" aria-label="随音乐律动、随歌曲推进变换气候的体素星球"></canvas>

  <div id="overlay" class="show">
    <div class="sheet">
      <div class="glyph" id="ui-glyph" aria-hidden="true"></div>
      <div class="copy">
        <h1 id="ui-headline"></h1>
        <p class="sub" id="ui-sub"></p>
        <div class="steps">
          <div class="step"><div class="label"><span id="txt-planet">正在铺设地表 0%</span><span id="voxel-total"></span></div><div class="bar"><div id="bar-planet"></div></div></div>
          <div class="step"><div class="label"><span id="txt-audio">等待音频…</span><span>离线节奏分析</span></div><div class="bar"><div id="bar-audio"></div></div></div>
        </div>
        <button id="start-btn" disabled>正在搭建…</button>
        <p class="note">拖动旋转，滚轮靠近，点击地标会有回应。进度条上的刻度是七个气候章节，点一下就能跳过去。</p>
      </div>
    </div>
  </div>

  <nav id="places" aria-label="地标"></nav>

  <div id="player">
    <button id="play-btn" aria-label="播放">
      <svg id="icon-play" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>
      <svg id="icon-pause" viewBox="0 0 16 16" style="display:none"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
    </button>
    <div class="meta">
      <div class="row"><span id="chapter-name"></span><span id="track-name"></span><span id="track-time"></span></div>
      <div id="progress" role="slider" aria-label="播放进度"><div id="progress-fill"></div><div id="chapter-marks"></div></div>
    </div>
    <div class="vol">
      <svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量">
    </div>
  </div>

  <div id="stats"></div>
  <div id="toast"></div>
  <div id="fatal"></div>

  <script>
    (function () {
      var threeSources = ["vendor/three.min.js", "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js", "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"];
      var modules = ["js/scene-manifest.js", "js/config.js", "js/terrain-core.js", "js/terrain.js", "js/voxelmodel.js", "js/glow.js", "js/lights-score.js", "js/climate.js", "js/planet.js", "js/audio.js",
        "js/kit-core.js", "js/kit.js", "js/placement.js", "js/weather.js", "js/scene.js", "js/gallery.js", "js/sky.js", "js/controls.js", "js/lighting.js", "js/ui.js", "assets/track.js", "?assets/track.local.js", "js/main.js"];
      function load(src, ok, fail) { var s = document.createElement("script"); s.src = src; s.async = false; s.onload = ok; s.onerror = function () { s.remove(); fail && fail(); }; document.head.appendChild(s); }
      function die(msg) { var f = document.getElementById("fatal"); f.textContent = msg; f.classList.add("show"); }
      function loadThree(i) { if (i >= threeSources.length) return die("Three.js 没有加载成功：请把 three@0.158 的 three.min.js 放进 vendor/。"); load(threeSources[i], function () { loadModule(0); }, function () { loadThree(i + 1); }); }
      function loadModule(i) { if (i >= modules.length) return; var src = modules[i], opt = src[0] === "?"; if (opt) src = src.slice(1); load(src, function () { loadModule(i + 1); }, function () { if (opt) return loadModule(i + 1); die("缺少脚本：" + src); }); }
      loadThree(0);
    })();
  </script>
</body>
</html>
